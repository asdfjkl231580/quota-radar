name: 哨兵（每日检查官方额度消息）
on:
  # 唯一定时入口是 Vercel 每日 09:30 北京；不叠加 GitHub 定时，避免重复采集计费。
  workflow_dispatch:
    inputs:
      tikhub:
        description: "带 TikHub 直查"
        type: boolean
        default: false
concurrency: { group: sentinel, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
      - run: npm i -g vercel@62.1.0
      - name: 哨兵
        env:
          TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_TO_CHAT_ID: ${{ secrets.FEISHU_TO_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.tikhub }}" = "true" ]; then
            node scripts/sentinel.mjs --tikhub
          else
            node scripts/sentinel.mjs
          fi
