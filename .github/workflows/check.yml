name: 离线回归与构建
on:
  pull_request:
  push:
    paths:
      - 'scripts/**'
      - 'site/**'
      - 'api/**'
      - 'tests/**'
      - 'data/events.json'
      - 'data/site.json'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run validate
      - run: npm run build
