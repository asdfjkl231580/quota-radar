name: 哨兵（每 10 分钟盯 X 官方账号）
on:
  schedule:
    - cron: "*/10 * * * *"     # 每 10 分钟：两参考站接口
    - cron: "3 * * * *"        # 每小时一次：加 TikHub 直查
  workflow_dispatch:
    inputs:
      tikhub:
        description: "带 TikHub 直查"
        type: boolean
        default: true
concurrency: { group: sentinel, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i -g vercel@latest
      - name: 哨兵
        env:
          TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_TO_CHAT_ID: ${{ secrets.FEISHU_TO_CHAT_ID }}
        run: |
          if [ "${{ github.event.schedule }}" = "3 * * * *" ] || [ "${{ github.event.inputs.tikhub }}" = "true" ]; then
            node scripts/sentinel.mjs --tikhub
          else
            node scripts/sentinel.mjs
          fi
